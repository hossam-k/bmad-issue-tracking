# common/merge-mr.yaml
#
# Purpose: Merge an MR/PR by IID on the git remote (GitLab MR or GitHub PR), whichever system is the issue tracker.
# Input variables: mr_iid (numeric), squash (default "false")
# Output variables:
#   - merged ("true" if merge CLI succeeded)
#   - merge_sha (string, from API after merge; empty if merge failed)
#   - error (string, non-empty if merge failed)
# Side effects: MERGES the MR/PR on the git remote (irreversible from here), then reads
#   the resulting merge SHA from the API. Callers must treat a non-zero exit or a
#   non-empty error as "not merged", never as "merge attempted".

# The git remote is resolved internally (mr_repo/mr_host/mr_project/mr_project_enc), so this works
# the same when the issue tracker is GitLab, GitHub or OpenProject. GIT_PLATFORM selects the CLI.
- INCLUDE: common/resolve-mr-repo

# === GitLab ===
- RUN: glab mr merge --yes --squash={squash} -R "{mr_repo}" {mr_iid}
  STORE: gl_merge_out
  GIT_PLATFORM: gitlab
  EXPECT_EXIT: any
# After merge, fetch the merge commit SHA via API (avoids the hardcoded git -C path issue)
- RUN: glab api "projects/{mr_project_enc}/merge_requests/{mr_iid}" --hostname {mr_host} | uv run --no-project python -c "
import json, sys
m = json.load(sys.stdin)
print(m.get('merge_commit_sha', '') or '')
"
  STORE: merge_sha
  GIT_PLATFORM: gitlab

# === GitHub ===
- RUN: gh pr merge {mr_iid} --squash --delete-branch -R "{mr_repo}"
  STORE: gh_merge_out
  GIT_PLATFORM: github
  EXPECT_EXIT: any
- RUN: gh api repos/{mr_project}/pulls/{mr_iid} --hostname {mr_host} --jq .merge_commit_sha
  STORE: merge_sha
  GIT_PLATFORM: github

# Derive merged/error from CLI outputs (truth source = exit code, not pipeline_status)
- RUN: uv run --no-project python -c "
import sys
gl = sys.argv[1].strip() if len(sys.argv) > 1 else ''
gh = sys.argv[2].strip() if len(sys.argv) > 2 else ''
# If either CLI produced output (stdout captured by the shell), the merge ran
print('true' if (gl or gh) else 'false')
" {gl_merge_out} {gh_merge_out}
  STORE: merged
- CHECK: merged eq "false"
  TRUE:
    - SET: { variable: error, value: "merge CLI failed (no stdout captured)" }
