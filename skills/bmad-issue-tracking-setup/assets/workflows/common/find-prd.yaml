# common/find-prd.yaml
#
# Purpose: Finds the PRD branch, pulls its worktree, and extracts prd_key.
#           prd_key comes from the current PRD branch, else from the only PRD branch;
#           when ambiguous the user is asked. The PRD file is
#           {planning_artifacts}/prds/{prd_key}/prd.md; its frontmatter is kept in sync.
# Input variables: (none)
# Output variables:
#   - prd_key: the PRD key from frontmatter or user input
#   - prd_worktree_path: the filesystem path to the PRD worktree
#   - prd_pattern: the resolved PRD branch pattern (from config)
# Side effects: pulls the PRD worktree; writes prd_key to PRD frontmatter if not present

- READ: _bmad/custom/issue-tracking.yaml
  EXTRACT:
    prd_pattern: issue_tracking.branch_patterns.prd
- RUN: uv run --no-project python -c "
import sys
print(sys.argv[1].replace('{prd_key}', '*'))
" {prd_pattern}
  STORE: prd_branch_glob
- RUN: git branch --list '{prd_branch_glob}'
  STORE: prd_branches
- CHECK: empty prd_branches
  TRUE:
    - OUTPUT:
        message: "No PRD found. Run /bmad-create-prd first."
        stop: true
- RUN: git worktree list
  STORE: worktree_list
- FILTER:
    source: worktree_list
    select: path
    where: branch matches "{prd_pattern}"
    store: prd_worktree_path
- RUN: cd {prd_worktree_path} && git pull --ff-only
  EXPECT_EXIT: 0
- RUN: git branch --show-current
  STORE: current_branch
# Derive prd_key: current branch if it is a PRD branch, else the only PRD branch (empty if ambiguous)
- RUN: git branch --list '{prd_branch_glob}' --format='%(refname:short)' | uv run --no-project python -c "
import re, sys
ph = chr(123) + 'prd_key' + chr(125)
rx = re.compile('^' + '(?P<k>[^/]+)'.join(re.escape(x) for x in sys.argv[1].split(ph)) + '$')
cur = rx.match((sys.argv[2:3] or [''])[0].strip())
keys = [m.group('k') for m in map(rx.match, sys.stdin.read().split()) if m]
print(cur.group('k') if cur else (keys[0] if len(set(keys)) == 1 else ''))
" {prd_pattern} "{current_branch}"
  STORE: prd_key
- CHECK: empty prd_key
  TRUE:
    - OUTPUT:
        message: "Several PRDs found:\n{prd_branches}\nWhich PRD key? (e.g. mobile-oidc)"
        store: prd_key
- READ: {planning_artifacts}/prds/{prd_key}/prd.md
  EXTRACT:
    frontmatter_prd_key: frontmatter.prd_key
- CHECK: exists frontmatter_prd_key
  TRUE:
    - STOP
  FALSE:
    - RUN: uv run --no-project python -c "
import sys
path, key = sys.argv[1], sys.argv[2]
with open(path, 'r', encoding='utf-8') as f:
    lines = f.readlines()
for i in range(1, len(lines)):
    if lines[i].strip() == '---':
        lines.insert(i, f'prd_key: {key}\n')
        break
with open(path, 'w', encoding='utf-8') as f:
    f.writelines(lines)
" {planning_artifacts}/prds/{prd_key}/prd.md {prd_key}
      EXPECT_EXIT: 0
